<!doctype html>
<html>
<head><meta charset="utf-8"><title>Engine Check</title></head>
<body style="font-family:monospace;background:#111;color:#0f0;padding:20px">
<h1>LastZHood Local Engine Self-Check</h1>
<div>Status: <span id="status" data-testid="engine-check-status">INIT</span></div>
<div>Message: <span id="message" data-testid="engine-check-message">-</span></div>
<pre id="log" data-testid="engine-check-log" style="white-space:pre-wrap"></pre>
<script>
const statusEl = document.getElementById('status');
const messageEl = document.getElementById('message');
const logEl = document.getElementById('log');
function log(t){ logEl.textContent += t + "\n"; }
function setStatus(s){ statusEl.textContent = s; }

(async () => {
  try {
    const bootstrap = await (await fetch('/engine-check-bootstrap.json')).json();
    setStatus('STARTING');
    const worker = new Worker('/local-game.worker.js');
    const timeout = setTimeout(() => { setStatus('TIMEOUT'); log('No OPEN within 150s'); }, 150000);
    worker.onmessage = ({ data }) => {
      if (data.type === 'loading') { messageEl.textContent = data.message; log('loading: ' + data.message); }
      else if (data.type === 'open') { clearTimeout(timeout); setStatus('OPEN_READY'); log('WORLD READY — engine booted and population prepared'); }
      else if (data.type === 'error') { clearTimeout(timeout); setStatus('ENGINE_ERROR'); messageEl.textContent = data.message; log('error: ' + data.message); }
    };
    worker.onerror = (e) => { clearTimeout(timeout); setStatus('WORKER_ERROR'); log('worker error: ' + (e.message||e)); };
    // ws url is unused for the readiness check; connectSocial fails quietly and does not block 'open'.
    worker.postMessage({ type: 'connect', url: 'wss://127.0.0.1:1/ws/selfcheck', bootstrap });
  } catch (e) { setStatus('FETCH_ERROR'); log(String(e)); }
})();
</script>
</body>
</html>
